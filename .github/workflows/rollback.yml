name: Roll back production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Optional production deployment URL (leave blank for the previous production deployment)
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Roll back production on Vercel
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel GitHub Actions secrets."
            exit 1
          fi

          if [ -n "$DEPLOYMENT_URL" ]; then
            npx --yes vercel rollback "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN"
          else
            npx --yes vercel rollback --token="$VERCEL_TOKEN"
          fi
